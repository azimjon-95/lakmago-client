<!doctype html>
<html lang="uz">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>LokmaGo</title>
    <meta name="theme-color" content="#FFFFFF" />
    <!--
      MUHIM: index.html HECH QACHON keshlanmasligi kerak — u har
      deploy'da yangi hash'langan JS/CSS fayllarga ishora qiladi
      (masalan index-b0dff25.js). Agar index.html'ning o'zi eskirib
      qolib qolsa, brauzer YANGI JS bor-yo'qligini BILMAYDI ham —
      hech qachon yangi kod ishga tushmaydi, HAR QANCHA marta
      deploy qilinsa ham.

      HTTP header (Cache-Control: no-cache) ENG ISHONCHLI yechim
      (server konfiguratsiyasi, qarang DEPLOY-SPA.md) — bu meta teg
      QO'SHIMCHA himoya, ayniqsa Telegram ichki WebView (iOS
      WKWebView) kabi ba'zi muhitlar HTTP header'ni to'liq hurmat
      qilmasligi mumkin bo'lgan hollarda.
    -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <!--
      ============================================================
      ERTA SOZLAMALAR — pastga surib yopilishni bloklash + ranglar
      ============================================================
      DIQQAT: bu yerda FULLSCREEN so'ralmaydi. To'liq ekran
      BotFather'dagi "Mode: Fullscreen" sozlamasi orqali
      ta'minlanadi va u ishlaydi — bu yerga qo'shish shart emas
      (avval urinib ko'rilgan, faqat zarar keltirgan).

      NIMA UCHUN <head> DA:
      disableVerticalSwipes() ilgari faqat React yuklangandan
      keyin (authenticateWithTelegram ichida) chaqirilardi. Bu
      juda kech — foydalanuvchi ilova ochilishi bilanoq pastga
      surib ulgurar va Telegram uni yopib yuborardi. Endi u SDK
      yuklangan zahoti, React bundle hatto so'ralmasidan oldin
      ishlaydi.

      ready() BU YERDA CHAQIRILMAYDI — u Telegram'ning yuklash
      ekranini erta olib tashlaydi. Uni React o'z vaqtida
      chaqiradi (lib/telegram.js).
    -->
    <script>
      (function () {
        var tg = window.Telegram && window.Telegram.WebApp;
        if (!tg) return;

        var apply = function () {
          // Pastga/tepaga surib yopish yoki kichraytirishni bloklaymiz
          // (Bot API 7.7+). Ilovadan chiqish faqat Закрыть tugmasi orqali.
          try { tg.disableVerticalSwipes && tg.disableVerticalSwipes(); } catch (e) {}

          // Status bar foni oq -> Telegram ikonlarni to'q chizishi kerak
          try { tg.setHeaderColor && tg.setHeaderColor('#FFFFFF'); } catch (e) {}
          try { tg.setBackgroundColor && tg.setBackgroundColor('#FFFFFF'); } catch (e) {}
        };

        apply();

        /*
         * .in-telegram klassi — CSS shu orqali body-scroll'ni
         * o'chirib, aylanishni .app-shell ichiga ko'chiradi
         * (batafsil izoh theme.css da). Faqat mobil Telegram
         * uchun, brauzerda odatiy xulq saqlanadi.
         */
        if (['android', 'android_x', 'ios'].indexOf(tg.platform) !== -1) {
          document.documentElement.classList.add('in-telegram');

          /*
           * iOS uchun eng muhim qism: konteyner scrollTop = 0 da
           * turса, tepaga tortish gestasi WebView'dan CHIQIB
           * Telegram oynasiga o'tadi va ilova yopiladi. 1 piksel
           * pastda ushlab tursak, iOS konteynerni "eng tepada
           * emas" deb hisoblaydi va gestani bizga qoldiradi.
           *
           * scroll hodisasi ko'pirmaydi (bubble bo'lmaydi), shuning
           * uchun capture rejimida tinglaymiz — shunda qaysi
           * sahifa ochiq bo'lishidan qat'i nazar ishlaydi.
           */
          document.addEventListener('scroll', function (e) {
            var el = e.target;
            if (el && el.classList && el.classList.contains('app-shell') && el.scrollTop === 0) {
              el.scrollTop = 1;
            }
          }, true);
        }

        /*
         * Takrorlash: Telegram ochilish animatsiyasi davomida o'z
         * sozlamalarini o'rnatadi va bizning erta chaqiruvimizni
         * ustidan yozib yuborishi mumkin. Bir necha marta qayta
         * beramiz — chaqiruvlar zararsiz (idempotent).
         */
        setTimeout(apply, 200);
        setTimeout(apply, 800);
        setTimeout(apply, 2000);

        // Ilova fon rejimidan qaytganda ham tiklanadi
        try { tg.onEvent && tg.onEvent('activated', apply); } catch (e) {}
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
