<!doctype html>
<html lang="uz">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>LokmaGo</title>
    <meta name="theme-color" content="#FFFFFF" />
    <!--
      MUHIM: index.html HECH QACHON keshlanmasligi kerak — u har
      deploy'da yangi hash'langan JS/CSS fayllarga ishora qiladi
      (masalan index-b0dff25.js). Agar index.html'ning o'zi eskirib
      qolib qolsa, brauzer YANGI JS bor-yo'qligini BILMAYDI ham —
      hech qachon yangi kod ishga tushmaydi, HAR QANCHA marta
      deploy qilinsa ham.

      HTTP header (Cache-Control: no-cache) ENG ISHONCHLI yechim
      (server konfiguratsiyasi, qarang DEPLOY-SPA.md) — bu meta teg
      QO'SHIMCHA himoya, ayniqsa Telegram ichki WebView (iOS
      WKWebView) kabi ba'zi muhitlar HTTP header'ni to'liq hurmat
      qilmasligi mumkin bo'lgan hollarda.
    -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <!--
      ?63 — rasmiy hujjatda ko'rsatilgan joriy versiya
      (core.telegram.org/bots/webapps). Query satri keshni ham
      chetlab o'tadi. Hujjat talabi: bu skript <head> ichida,
      BOSHQA HAR QANDAY SKRIPTDAN OLDIN turishi kerak.
    -->
    <script src="https://telegram.org/js/telegram-web-app.js?63"></script>
    <!--
      ============================================================
      TO'LIQ EKRAN (fullscreen) — NIMA UCHUN AYNAN SHU YERDA
      ============================================================
      Avval bu mantiq React ichida (lib/telegram.js -> App.jsx
      useEffect) turardi va ISHLAMASDI: diagnostika iOS'da
      requestFullscreen() ikki marta chaqirilganda ham na
      `fullscreenChanged`, na `fullscreenFailed` hodisasi
      kelmasligini ko'rsatdi — ya'ni Telegram so'rovni jimgina
      tashlab yuborgan.

      Sabab ARXITEKTURAVIY edi: useEffect faqat React bundle
      yuklanib, parse bo'lib, butun daraxt render bo'lgandan keyin
      ishlaydi — bu mobil tarmoqda bir necha yuz millisekund.
      Telegram esa bottom-sheet o'lchamini ochilish paytida hal
      qiladi; kechikkan so'rov e'tiborsiz qoladi.

      Endi so'rov SDK yuklangandan KEYINGI ZAHOTI, React bundle
      hatto yuklab olinmasidan oldin yuboriladi. Bu Telegram
      hujjatlarida tavsiya etilgan yondashuv: ready() va oyna
      rejimini boshqaruvchi chaqiruvlar imkon qadar erta bo'lishi
      kerak.

      Qo'shimcha ishonchlilik: so'rov SDK metodi VA bridge orqali
      to'g'ridan-to'g'ri yuboriladi, hamda javob kelmasa 400ms
      oraliq bilan bir necha marta takrorlanadi (klient hali
      tayyor bo'lmagan holat uchun). Muvaffaqiyat, xato yoki
      limitga yetilganda to'xtaydi va zaxira sifatida expand()
      chaqiriladi.
    -->
    <script>
      (function () {
        var tg = window.Telegram && window.Telegram.WebApp;
        if (!tg) return;

        /*
         * DIQQAT — ready() ATAYLAB ENG BOSHIDA CHAQIRILMAYDI.
         * Rasmiy hujjat: "Once this method is called, the loading
         * placeholder is hidden and the Mini App is shown" va uni
         * "asosiy interfeys elementlari yuklangach" chaqirish
         * tavsiya etiladi. Uni <head> da, DOM hali bo'sh paytda
         * chaqirsak, Telegram yuklash ekranini erta olib tashlaydi
         * va oyna o'tish animatsiyasi bilan bir vaqtga tushadi —
         * aynan shu paytda kelgan fullscreen so'rovi tushib
         * qolishi mumkin. Shuning uchun tartib teskari: avval
         * rejimni so'raymiz, ready() esa React tomonidan
         * (lib/telegram.js) chaqiriladi.
         */

        // Faqat mobil — desktop/vebda Telegram o'z oyna o'lchamini boshqaradi.
        if (['android', 'android_x', 'ios'].indexOf(tg.platform) === -1) return;

        /*
         * Hujjat aynan shuni tavsiya qiladi: to'liq ekranda header
         * shaffof bo'ladi, shuning uchun setHeaderColor bilan rang
         * berish kerak — Telegram shu rangdan status bar va
         * boshqaruv elementlari uchun kontrast rang tanlaydi.
         * So'rovdan OLDIN o'rnatamiz.
         */
        try { tg.setHeaderColor && tg.setHeaderColor('#FFFFFF'); } catch (e) {}

        var state = { supported: false, tries: 0, failed: null };
        window.__lokmagoFs = state;

        state.supported = typeof tg.requestFullscreen === 'function'
          && (typeof tg.isVersionAtLeast !== 'function' || tg.isVersionAtLeast('8.0'));

        var expand = function () { try { tg.expand(); } catch (e) {} };

        // Bot API 8.0 dan eski klient — faqat kengaytirish mumkin.
        if (!state.supported) { expand(); return; }

        // Telegram bridge — SDK ichida ham aynan shu transportlar
        // ishlatiladi. SDK chaqiruvni yutib yuborsa ham, bu yetkazadi.
        var post = function (type) {
          try {
            if (window.TelegramWebviewProxy && window.TelegramWebviewProxy.postEvent) {
              window.TelegramWebviewProxy.postEvent(type, '{}');
            } else if (window.external && window.external.notify) {
              window.external.notify(JSON.stringify({ eventType: type, eventData: {} }));
            } else if (window.parent && window.parent !== window) {
              window.parent.postMessage(JSON.stringify({ eventType: type, eventData: {} }), '*');
            }
          } catch (e) {}
        };

        var request = function () {
          state.tries++;
          try { tg.requestFullscreen(); } catch (e) {}
          post('web_app_request_fullscreen');
        };

        try {
          tg.onEvent('fullscreenFailed', function (e) {
            state.failed = (e && e.error) || 'unknown';
            expand(); // to'liq ekran imkonsiz — hech bo'lmasa kengaytiramiz
          });
        } catch (e) {}

        request();

        /*
         * Takroriy urinish. Telegram javob bermasligining eng
         * ehtimolli sababi — klient tomonining hali tayyor
         * emasligi, shuning uchun bir necha marta so'raymiz.
         * To'xtash sharti: fullscreen'ga o'tildi / xato keldi /
         * urinishlar tugadi.
         */
        var timer = setInterval(function () {
          if (tg.isFullscreen || state.failed || state.tries >= 12) {
            clearInterval(timer);
            if (!tg.isFullscreen) expand(); // zaxira
            return;
          }
          request();
        }, 400);
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
